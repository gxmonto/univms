name: Release

# Triggered by `npm run release:major|minor -- --push` (tag vX.Y.Z).
# Builds the Windows installer + portable exe and the Linux .deb/.rpm, then attaches them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build Windows installer and portable exe
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install nfpm
        run: |
          mkdir -p vendor/tools
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar xz -C vendor/tools nfpm
          vendor/tools/nfpm --version
      - name: Build .deb and .rpm
        run: npm run dist:linux
      - name: Verify packages
        run: |
          dpkg-deb -I dist/*.deb | head -12
          sudo apt-get install -y -qq rpm >/dev/null && rpm -qpi dist/*.rpm | head -12
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract changelog section
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '/^## /{p = index($0, "## " ver " ") == 1} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "UniVMS $VER" > notes.md
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "UniVMS ${GITHUB_REF_NAME#v}" --notes-file notes.md artifacts/windows/* artifacts/linux/*
