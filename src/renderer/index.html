<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: univms-map:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' univms-map:;" />
  <title>UniVMS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo"></span><span class="name">UniVMS</span><span class="tag" id="aux-tag"></span></div>
      <nav id="nav"></nav>
      <div class="top-right">
        <button class="icon-btn" id="btn-alarms" title="Unacknowledged alarms"><span class="ico"></span><span class="badge" id="alarm-badge" hidden>0</span></button>
        <button class="icon-btn" id="btn-newwin" title="Open a new live view window"></button>
        <button class="icon-btn" id="btn-fullscreen" title="Fullscreen (F11)"></button>
        <button class="icon-btn" id="btn-lock" title="Lock" hidden></button>
        <span class="user" id="current-user"></span>
        <span class="win-controls">
          <button class="win-btn" id="win-min" title="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="win-btn" id="win-max" title="Maximize"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="win-btn close" id="win-close" title="Close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.1"/></svg></button>
        </span>
      </div>
    </header>
    <main id="view"></main>
    <footer id="statusbar">
      <span id="status-left">Ready</span>
      <span id="status-right"></span>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="popup-root"></div>
  <div id="login-root" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
