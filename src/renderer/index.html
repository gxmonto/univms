<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: univms-map:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' univms-map:;" />
  <title>UniVMS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo"></span><span class="name">UniVMS</span><span class="tag" id="aux-tag"></span></div>
      <nav id="nav"></nav>
      <div class="top-right">
        <button class="icon-btn" id="btn-alarms" title="Unacknowledged alarms"><span class="ico"></span><span class="badge" id="alarm-badge" hidden>0</span></button>
        <button class="icon-btn" id="btn-newwin" title="Open a new live view window"></button>
        <button class="icon-btn" id="btn-fullscreen" title="Fullscreen (F11)"></button>
        <button class="icon-btn" id="btn-lock" title="Lock" hidden></button>
        <span class="user" id="current-user"></span>
      </div>
    </header>
    <main id="view"></main>
    <footer id="statusbar">
      <span id="status-left">Ready</span>
      <span id="status-right"></span>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="popup-root"></div>
  <div id="login-root" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
